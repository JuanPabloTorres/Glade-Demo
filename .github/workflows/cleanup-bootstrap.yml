name: Cleanup Bootstrap Artifacts

on:
  workflow_run:
    workflows: ["Bootstrap MatterReady"]
    types: [completed]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm scaffold exists
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/app/main.py
          test -f frontend/src/api/endpointRegistry.ts
          test -f contracts/api-contracts.json
          test -f docs/ARCHITECTURE.md

      - name: Remove temporary archive blocks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -- .bootstrap
          git commit -m "chore: remove bootstrap transfer artifacts"
          git push origin main
