name: Bootstrap MatterReady

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct project archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          source = b"".join(
              Path(f".bootstrap/part-{index:02d}").read_bytes()
              for index in range(4)
          )
          payload = re.sub(rb"[^A-Za-z0-9+/=]", b"", source).replace(b"=", b"")
          payload += b"=" * ((-len(payload)) % 4)
          archive = base64.b64decode(payload, validate=True)
          Path("/tmp/matter-ready-demo.tar.gz").write_bytes(archive)
          PY
          gzip -t /tmp/matter-ready-demo.tar.gz
          mkdir -p /tmp/matter-ready
          tar -xzf /tmp/matter-ready-demo.tar.gz -C /tmp/matter-ready
          cp -a /tmp/matter-ready/matter-ready-demo/. ./
          rm -f .github/workflows/ci.yml

      - name: Commit project scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]]@users.noreply.github.com"
          git add -- \
            .agents \
            .editorconfig \
            .env.example \
            .github/copilot-instructions.md \
            .githooks \
            .gitignore \
            .python-version \
            AGENTS.md \
            Makefile \
            README.md \
            VALIDATION.md \
            api \
            backend \
            contracts \
            docker-compose.yml \
            docs \
            frontend \
            package.json \
            render.yaml \
            requirements.txt \
            scripts \
            vercel.json
          if git diff --cached --quiet; then
            echo "No scaffold changes detected."
            exit 0
          fi
          git commit -m "feat: scaffold MatterReady legal intake demo"
          git push origin main
