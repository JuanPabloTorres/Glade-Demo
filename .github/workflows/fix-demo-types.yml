name: fix-demo-types

on:
  push:
    branches: [feat/stable-guided-demo-workspace]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stable-guided-demo-workspace
          token: ${{ github.token }}
      - name: Fix strict TypeScript checks
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('frontend/src/api/demoMatterApi.ts')
          content = api.read_text(encoding='utf-8')
          content = content.replace(
              'label: FIELD_LABELS[String(field)],',
              'label: FIELD_LABELS[String(field)] ?? String(field),',
          )
          api.write_text(content, encoding='utf-8')

          test = Path('frontend/src/api/demoMatterApi.test.ts')
          content = test.read_text(encoding='utf-8')
          content = content.replace(
              '    await demoMatterApi.resolveConflict(\n      GUIDED_DEMO_MATTER_ID,\n      conflicts[0].id,\n      conflicts[0].canonical_value,\n    );',
              '    const conflict = conflicts[0];\n    expect(conflict).toBeDefined();\n    if (!conflict) throw new Error("Expected guided conflict");\n\n    await demoMatterApi.resolveConflict(\n      GUIDED_DEMO_MATTER_ID,\n      conflict.id,\n      conflict.canonical_value,\n    );',
          )
          test.write_text(content, encoding='utf-8')
          PY
          rm .github/workflows/fix-demo-types.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/src/api/demoMatterApi.ts frontend/src/api/demoMatterApi.test.ts .github/workflows/fix-demo-types.yml
          git commit -m "fix: satisfy strict demo workspace types"
          git push
