name: bump-0.4.0

on:
  push:
    branches: [feat/stable-guided-demo-workspace]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stable-guided-demo-workspace
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Prepare minor release
        run: |
          npm run version:minor
          (cd backend && uv lock)
          rm .github/workflows/bump-0.4.0.yml
      - name: Commit synchronized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION package.json frontend/package.json frontend/package-lock.json backend/pyproject.toml backend/uv.lock .github/workflows/bump-0.4.0.yml
          git commit -m "release: prepare MatterReady v0.4.0"
          git push
