name: bump-0.3.1

on:
  push:
    branches: [fix/vercel-auth-runtime]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Prepare patch release
        run: |
          npm run version:patch
          (cd backend && uv lock)
          rm .github/workflows/bump-0.3.1.yml
      - name: Commit synchronized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION package.json frontend/package.json frontend/package-lock.json backend/pyproject.toml backend/uv.lock requirements.txt backend/tests/test_production_dependencies.py .github/workflows/bump-0.3.1.yml
          git commit -m "release: prepare MatterReady v0.3.1"
          git push
