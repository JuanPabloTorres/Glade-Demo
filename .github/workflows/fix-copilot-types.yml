name: fix-copilot-types

on:
  push:
    branches: [feat/ai-intake-copilot]
    paths:
      - .github/workflows/fix-copilot-types.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-intake-copilot
          token: ${{ github.token }}
      - name: Apply narrow typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/copilot_service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import pandas as pd\n', 'import pandas as pd  # type: ignore[import-untyped]\n')
          text = text.replace('confidence=float(row["confidence"]),', 'confidence=float(str(row["confidence"])),')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-copilot-types.yml').unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/app/services/copilot_service.py .github/workflows/fix-copilot-types.yml
          git commit -m "fix: narrow pandas typing boundaries"
          git push origin HEAD:feat/ai-intake-copilot
