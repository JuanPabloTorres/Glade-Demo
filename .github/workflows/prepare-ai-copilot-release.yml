name: prepare-ai-copilot-release

on:
  push:
    branches: [feat/ai-intake-copilot]
    paths:
      - .github/workflows/prepare-ai-copilot-release.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-intake-copilot
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Prepare major release and lock dependencies
        run: |
          npm run version:major
          (cd backend && uv lock)
          rm .github/workflows/prepare-ai-copilot-release.yml
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION package.json frontend/package.json frontend/package-lock.json backend/pyproject.toml backend/uv.lock .github/workflows/prepare-ai-copilot-release.yml
          git commit -m "release: prepare MatterReady AI Intake Copilot v1.0.0"
          git push origin HEAD:feat/ai-intake-copilot
