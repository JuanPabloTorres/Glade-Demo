name: prepare-bankruptcy-release

on:
  push:
    branches: [feat/bankruptcy-guidance-platform]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Prepare release metadata
        run: |
          npm run version:major
          (cd backend && uv lock)
          rm .github/workflows/prepare-bankruptcy-release.yml
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION package.json frontend/package.json frontend/package-lock.json backend/pyproject.toml backend/uv.lock .github/workflows/prepare-bankruptcy-release.yml
          git commit -m "release: prepare FreshStart v2.0.0"
          git push
