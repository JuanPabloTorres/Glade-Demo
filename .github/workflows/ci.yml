name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  versioning:
    name: versioning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm run version:check
      - name: Verify version is newer than main
        if: github.event_name == 'pull_request'
        run: npm run version:check-against -- origin/main
      - name: Verify version increment on main
        if: github.event_name == 'push'
        run: npm run version:check-bump

  # `versioning`, `governance`, `backend`, `frontend` and `e2e` are deliberately
  # independent. They were chained (versioning → governance → backend+frontend
  # → e2e), which made the critical path the *sum* of the slowest job in each
  # link — roughly 17 minutes — even though no job consumes another's artifacts:
  # `e2e` installs its own dependencies and starts its own servers. Running them
  # in parallel makes the critical path the slowest single job instead.
  #
  # The trade is compute for latency: a governance failure no longer cancels the
  # test jobs before they start, so a bad push burns a few extra runner-minutes.
  # `cancel-in-progress` on the concurrency group already bounds that per branch.
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm run agent:validate
      - name: Verify change fragment exists on pull requests
        if: github.event_name == 'pull_request'
        run: test -n "$(find changes -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)"

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run python -m compileall app
      - run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run contracts:generate
      - run: git diff --exit-code -- src/api/apiContracts.generated.ts
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # Keyed on the lockfile so the cache is invalidated exactly when the
      # @playwright/test version moves — a stale browser build against a newer
      # driver is a failure mode that looks like a flaky test.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
