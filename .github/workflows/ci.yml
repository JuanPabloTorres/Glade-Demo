name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/starlette-testclient-httpx2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  versioning:
    name: versioning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm run version:check
      - name: Verify version is newer than main
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/starlette-testclient-httpx2'
        run: npm run version:check-against -- origin/main
      - name: Verify version increment on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run version:check-bump

  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm run agent:validate
      - name: Verify change fragment exists on pull requests
        if: github.event_name == 'pull_request'
        run: test -n "$(find changes -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)"

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      # Strands is an optional runtime extra, but app/ai contains typed imports
      # behind that optional boundary. Type-check with the extra installed so
      # mypy validates those imports instead of failing before the test gate.
      - run: uv run --extra agents mypy app
      - run: uv run python -m compileall app
      - run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run contracts:generate
      - run: git diff --exit-code -- src/api/apiContracts.generated.ts
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
