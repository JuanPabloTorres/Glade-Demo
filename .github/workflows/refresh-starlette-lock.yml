name: refresh-starlette-lock

on:
  push:
    branches: [fix/starlette-testclient-httpx2]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/starlette-testclient-httpx2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Bump patch release
        run: npm run version:patch
      - name: Regenerate backend lock
        working-directory: backend
        run: uv lock
      - name: Prepend release notes
        shell: python
        run: |
          from pathlib import Path
          path = Path("RELEASE_NOTES.md")
          current = path.read_text(encoding="utf-8")
          header = """# FreshStart 4.14.2

Backend tests now install `httpx2` alongside legacy `httpx`, matching the
supported Starlette `TestClient` path and removing the remaining
`StarletteDeprecationWarning` without hiding it with warning filters. The
production dependency set and application behavior are unchanged. The backend
lockfile was regenerated from `pyproject.toml` as part of the patch release.

"""
          if not current.startswith("# FreshStart 4.14.2\n"):
              path.write_text(header + current, encoding="utf-8")
      - name: Commit generated release metadata
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION package.json frontend/package.json frontend/package-lock.json backend/uv.lock RELEASE_NOTES.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump version to 4.14.2 and refresh backend lock"
          git push origin HEAD:fix/starlette-testclient-httpx2
