services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freshstart
      POSTGRES_USER: freshstart
      POSTGRES_PASSWORD: freshstart-local
    ports:
      - "5432:5432"
    volumes:
      - freshstart_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshstart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freshstart_postgres:
