services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matter_ready
      POSTGRES_USER: matter_ready
      POSTGRES_PASSWORD: matter_ready
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matter_ready -d matter_ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - matter_ready_db:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://matter_ready:matter_ready@db:5432/matter_ready
      CORS_ORIGINS: http://localhost:5173
      DOCUMENT_INTELLIGENCE_PROVIDER: rules
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  matter_ready_db:
