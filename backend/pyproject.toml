[project]
name = "freshstart-bankruptcy-api"
version = "4.0.0"
description = "FreshStart bankruptcy intake, financial organization, and attorney collaboration API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "pandas>=3.0,<4.0",
  "rapidfuzz>=3.14,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
ai = [
  "torch>=2.8,<3.0",
  "transformers>=4.55,<5.0",
  "sentence-transformers>=5.0,<6.0",
  "accelerate>=1.10,<2.0",
]
# Strands Agents orchestration layer (ADR-0007). Optional, exactly like the
# `ai` extra above and for the same reason: the trimmed Vercel function must
# stay importable without it. `app.ai.agents` lazy-imports strands, and
# AgentRuntime degrades to the deterministic RuleBasedProvider when the
# import fails, so an install without this extra is a supported configuration,
# not a broken one.
#
# `strands-agents-tools` is deliberately NOT included: it is the SDK's
# prebuilt tool catalogue (shell access, file I/O, Slack, AWS) and pulls
# slack-bolt/boto3/sympy/watchdog with it. Every tool this app exposes is
# written locally in app/ai/tools and bound to an authorized case — a generic
# shell/file tool catalogue is precisely what must never reach these agents.
agents = [
  "strands-agents[openai,ollama]>=1.50,<2.0",
]
# Document ingestion (master instruction §7.5): Docling primary, PyMuPDF PDF
# fallback, python-docx/openpyxl for Office formats. Tesseract OCR is
# system-level (not a pip package) and stays opt-in at the deployment layer.
documents = [
  "docling>=2.60,<3.0",
  "pymupdf>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
]
# Local RAG (master instruction §7.6): FAISS default, Chroma as an
# alternative — never installed together with the lightweight Vercel build.
rag = [
  "faiss-cpu>=1.9,<2.0",
  "chromadb>=0.5,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic autogenerates versions/*.py from a fixed template (script.py.mako)
# we don't control the style of — excluded from lint like any other
# generated code, mirroring how migration tooling is typically treated.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
