<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-bottom) resolve to
         a real value on notched devices. Without it that inset is always 0 and
         the floating bottom navigation sits under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Fresh Start organiza ingresos, gastos, deudas, bienes y evidencia para preparar una consulta de bancarrota con un abogado. No es un bufete y no ofrece asesoramiento legal."
    />
    <meta name="theme-color" content="#2563eb" />

    <!-- The tab carries the product's name and nothing else. It used to read
         "Fresh Start | Preparación de bancarrota", which put a tagline in a
         space roughly fifteen characters wide and left the name truncated on a
         browser with several tabs open. -->
    <title>Fresh Start</title>

    <!-- SVG only, deliberately. Every browser this demo targets supports an SVG
         favicon, one vector stays crisp at 16px and on a retina bookmark bar,
         and declaring it stops the automatic /favicon.ico request that was
         404ing. A .ico would mean a binary in the repository and a generation
         step for the one case SVG does not cover. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
