services:
  - type: web
    name: matter-ready-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: matter-ready-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: DOCUMENT_INTELLIGENCE_PROVIDER
        value: rules

databases:
  - name: matter-ready-db
    databaseName: matter_ready
    user: matter_ready
